// Still Life x FreeTerraForged Bridge (mod id stilllife_ftf_bridge) for NeoForge and Fabric, Minecraft 1.21.1, Java 21.
//   neoforge/  NeoForge's ModDevGradle  -> neoforge/build/libs/stilllife_ftf_bridge-<version>-neoforge.jar
//   fabric/    Fabric Loom              -> fabric/build/libs/stilllife_ftf_bridge-<version>-fabric.jar
// Both compile common/ in. FreeTerraForged is not on a public Maven: put its jars in libs/ (see libs/README.md).
plugins {
    id 'net.neoforged.moddev' apply false
    id 'fabric-loom' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = 'io.github.lifeforged'
    base { archivesName = 'stilllife_ftf_bridge' }
    version = "${project.mod_version}-${project.name}"

    repositories {
        mavenCentral()
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    // the shared code and data, compiled into each loader's jar
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.named('processResources', ProcessResources) {
        inputs.property 'version', project.mod_version
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
            expand version: project.mod_version
        }
    }

    tasks.named('jar') {
        manifest {
            attributes('Implementation-Title': 'stilllife_ftf_bridge', 'Implementation-Version': project.mod_version)
        }
    }
}
