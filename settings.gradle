pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
    plugins {
        // versions from gradle.properties
        id 'net.neoforged.moddev' version "${moddev_version}"
        id 'fabric-loom' version "${loom_version}"
    }
}

plugins {
    // downloads the Java 21 toolchain if the machine has none
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'lifeforged'

// The bridge mod, for two loaders. common/ holds the shared code and data (all features and mixins); it has no Gradle
// project of its own: each loader project compiles it into its own jar. Still Life's FTF edition is not built here: Still
// Life is All Rights Reserved, so this repository only holds the script that turns your own copy of Still Life into the
// FTF edition (still-life-patch/).
include 'neoforge', 'fabric'
