// Still Life x FreeTerraForged Bridge (mod id stilllife_ftf_bridge)
version = project.bridge_version
base { archivesName = 'stilllife_ftf_bridge' }

neoForge {
    mods {
        stilllife_ftf_bridge { sourceSet sourceSets.main }
    }
    runs {
        // ./gradlew :bridge:runServer starts a dev server with only NeoForge and this mod; FreeTerraForged, Still Life
        // and VanillaBackport must be added to run/mods for anything to happen
        server {
            server()
            gameDirectory = project.file('run')
        }
    }
}
